<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Monitor{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://unpkg.com/htmx-ext-json-enc@2.0.1/json-enc.js"></script>
    <style>
        :root {
            --color-bg: #f8f9fa;
            --color-surface: #ffffff;
            --color-border: #dee2e6;
            --color-text: #212529;
            --color-text-muted: #6c757d;
            --color-primary: #0d6efd;
            --color-primary-hover: #0b5ed7;
            --color-active: #0d6efd;
            --color-blocked: #fd7e14;
            --color-done: #198754;
            --color-cancelled: #6c757d;
            --color-info: #0dcaf0;
            --color-warn: #ffc107;
            --color-error: #dc3545;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--color-bg);
            color: var(--color-text);
            line-height: 1.5;
        }
        nav {
            background: var(--color-surface);
            border-bottom: 1px solid var(--color-border);
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }
        nav .brand {
            font-weight: 700;
            font-size: 1.15rem;
            color: var(--color-text);
            text-decoration: none;
        }
        nav a {
            color: var(--color-primary);
            text-decoration: none;
            font-size: 0.9rem;
        }
        nav a:hover { text-decoration: underline; }
        nav a.active { color: var(--color-text); font-weight: 600; }
        .container {
            max-width: 960px;
            margin: 1.5rem auto;
            padding: 0 1rem;
        }
        h1 { font-size: 1.5rem; margin-bottom: 1rem; }
        h2 { font-size: 1.2rem; margin-bottom: 0.75rem; }
        h3 { font-size: 1rem; margin-bottom: 0.5rem; }
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .page-header h1 { margin-bottom: 0; }

        /* Cards */
        .card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            padding: 1.25rem;
            margin-bottom: 1rem;
        }
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.75rem;
        }

        /* Status badges */
        .badge {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .badge-active { background: #cfe2ff; color: var(--color-active); }
        .badge-blocked { background: #ffe5d0; color: var(--color-blocked); }
        .badge-done { background: #d1e7dd; color: var(--color-done); }
        .badge-cancelled { background: #e2e3e5; color: var(--color-cancelled); }
        .badge-archived { background: #e2e3e5; color: var(--color-cancelled); }

        /* Level indicators */
        .level-info { color: var(--color-info); }
        .level-warn { color: var(--color-warn); }
        .level-error { color: var(--color-error); }

        /* Tables / lists */
        .task-list { list-style: none; }
        .task-list li {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--color-border);
        }
        .task-list li:last-child { border-bottom: none; }
        .task-list a {
            color: var(--color-primary);
            text-decoration: none;
            font-weight: 500;
        }
        .task-list a:hover { text-decoration: underline; }
        .task-summary {
            color: var(--color-text-muted);
            font-size: 0.85rem;
            margin-left: auto;
            max-width: 40%;
            text-overflow: ellipsis;
            overflow: hidden;
            white-space: nowrap;
        }

        /* Forms */
        .form-row {
            display: flex;
            gap: 0.5rem;
            align-items: flex-end;
            margin-top: 0.75rem;
            flex-wrap: wrap;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }
        .form-group label {
            font-size: 0.8rem;
            color: var(--color-text-muted);
            font-weight: 500;
        }
        input[type="text"], textarea, select {
            padding: 0.4rem 0.6rem;
            border: 1px solid var(--color-border);
            border-radius: 4px;
            font-size: 0.9rem;
            font-family: inherit;
        }
        textarea { resize: vertical; min-height: 3rem; }
        button, .btn {
            padding: 0.4rem 0.8rem;
            border: none;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .btn-primary {
            background: var(--color-primary);
            color: #fff;
        }
        .btn-primary:hover { background: var(--color-primary-hover); }
        .btn-sm { padding: 0.25rem 0.5rem; font-size: 0.8rem; }

        /* Update timeline */
        .update-thread { list-style: none; }
        .update-item {
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--color-border);
        }
        .update-item:last-child { border-bottom: none; }
        .update-meta {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: var(--color-text-muted);
            margin-bottom: 0.25rem;
        }
        .update-message { font-size: 0.9rem; }
        .feed-context {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.35rem;
            font-size: 0.85rem;
        }
        .feed-context a {
            color: var(--color-primary);
            text-decoration: none;
            font-weight: 600;
        }
        .feed-context a:hover { text-decoration: underline; }
        .feed-workstream {
            color: var(--color-text-muted);
            font-size: 0.8rem;
        }
        .stream-tabs {
            display: flex;
            gap: 0.25rem;
            border: 1px solid var(--color-border);
            border-radius: 6px;
            padding: 0.2rem;
            background: var(--color-surface);
        }
        .stream-tabs a {
            color: var(--color-text-muted);
            text-decoration: none;
            padding: 0.35rem 0.65rem;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .stream-tabs a.active {
            color: #fff;
            background: var(--color-primary);
        }
        .stream-group {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        .stream-group-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 0.75rem;
        }
        .stream-group-header h2 { margin-bottom: 0.15rem; }
        .stream-group-header a,
        .stream-lane-header a {
            color: var(--color-primary);
            text-decoration: none;
        }
        .stream-group-header a:hover,
        .stream-lane-header a:hover { text-decoration: underline; }
        .stream-lanes {
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: minmax(280px, 360px);
            gap: 1rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
        }
        .stream-lane {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            padding: 1rem;
            max-height: calc(100vh - 9rem);
            overflow-y: auto;
        }
        .stream-lane-header {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.35rem;
            margin-bottom: 0.75rem;
            position: sticky;
            top: -1rem;
            background: var(--color-surface);
            padding-top: 0.25rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--color-border);
        }

        /* Responsive */
        @media (max-width: 600px) {
            .form-row { flex-direction: column; }
            .task-summary { max-width: 100%; margin-left: 0; }
            .stream-tabs { width: 100%; }
            .stream-tabs a { flex: 1; text-align: center; }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav>
        <a href="/dashboard" class="brand">Monitor</a>
        <a href="/dashboard">Dashboard</a>
        <a href="/stream">Stream</a>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
